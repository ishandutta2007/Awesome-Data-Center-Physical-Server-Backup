<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.25"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatBeam {
        0% { transform: translateY(0px); opacity: 0.2; }
        50% { transform: translateY(-15px); opacity: 0.8; }
        100% { transform: translateY(0px); opacity: 0.2; }
      }
      @keyframes serverBlink1 {
        0%, 100% { fill: #22c55e; opacity: 1; }
        50% { fill: #15803d; opacity: 0.4; }
      }
      @keyframes serverBlink2 {
        0%, 100% { fill: #38bdf8; opacity: 0.4; }
        50% { fill: #38bdf8; opacity: 1; }
      }
      @keyframes dataStream {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      .glow-orb-1 {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .glow-orb-2 {
        animation: pulseGlow 8s ease-in-out infinite reverse;
        transform-origin: 1000px 320px;
      }
      .beam-float {
        animation: floatBeam 4s ease-in-out infinite;
      }
      .led-1 { animation: serverBlink1 1.8s infinite; }
      .led-2 { animation: serverBlink2 1.2s infinite; }
      .data-line {
        stroke-dasharray: 8 6;
        animation: dataStream 3s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Deep Tech Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in the Background -->
  <circle class="glow-orb-1" cx="180" cy="90" r="130" fill="#38bdf8" opacity="0.18" filter="url(#glow)"/>
  <circle class="glow-orb-2" cx="1020" cy="310" r="160" fill="#818cf8" opacity="0.18" filter="url(#glow)"/>
  <circle cx="600" cy="380" r="100" fill="#c084fc" opacity="0.1" filter="url(#glow)"/>

  <!-- Background Data Center Server Graphic (Right side) -->
  <g transform="translate(930, 70)" opacity="0.85">
    <!-- Server Rack Cabinet Outline -->
    <rect x="0" y="0" width="190" height="270" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2" filter="url(#cardGlow)" />
    <line x1="20" y1="0" x2="20" y2="270" stroke="#1e293b" stroke-width="1.5"/>
    <line x1="170" y1="0" x2="170" y2="270" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Server Blade 1 -->
    <rect x="28" y="20" width="134" height="34" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle class="led-1" cx="42" cy="37" r="4" fill="#22c55e" />
    <circle class="led-2" cx="54" cy="37" r="4" fill="#38bdf8" />
    <line x1="70" y1="37" x2="148" y2="37" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

    <!-- Server Blade 2 -->
    <rect x="28" y="66" width="134" height="34" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle class="led-2" cx="42" cy="83" r="4" fill="#38bdf8" />
    <circle class="led-1" cx="54" cy="83" r="4" fill="#22c55e" />
    <line x1="70" y1="83" x2="148" y2="83" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

    <!-- Server Blade 3 (Storage Vault) -->
    <rect x="28" y="112" width="134" height="34" rx="4" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" />
    <circle class="led-1" cx="42" cy="129" r="4" fill="#22c55e" />
    <circle class="led-1" cx="54" cy="129" r="4" fill="#22c55e" />
    <line x1="70" y1="129" x2="148" y2="129" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/>

    <!-- Server Blade 4 -->
    <rect x="28" y="158" width="134" height="34" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle class="led-2" cx="42" cy="175" r="4" fill="#38bdf8" />
    <circle class="led-2" cx="54" cy="175" r="4" fill="#38bdf8" />
    <line x1="70" y1="175" x2="148" y2="175" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

    <!-- Server Blade 5 -->
    <rect x="28" y="204" width="134" height="42" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle class="led-1" cx="42" cy="225" r="4" fill="#22c55e" />
    <circle class="led-2" cx="54" cy="225" r="4" fill="#38bdf8" />
    <line x1="70" y1="225" x2="148" y2="225" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Dynamic Connecting Data Streams -->
  <path class="data-line" d="M 620 180 Q 780 180 930 130" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.65" />
  <path class="data-line" d="M 640 220 Q 800 240 930 225" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.65" />

  <!-- Shield / Vault Cyber Icon Left Graphic -->
  <g transform="translate(90, 80)" class="beam-float">
    <polygon points="40,5 75,18 75,60 40,85 5,60 5,18" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
    <path d="M40,25 L40,65 M25,42 L40,65 L55,42" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- FOREGROUND TEXT CONTENT: Clean, High Contrast, Prominent -->
  <g transform="translate(190, 115)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="280" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="16" cy="15" r="5" fill="#38bdf8"/>
    <text x="32" y="20" fill="#93c5fd" class="badge-text">ENTERPRISE RESILIENCE &amp; BMR</text>

    <!-- Main Title -->
    <text x="0" y="78" fill="url(#titleGrad)" class="title-text" font-size="44">Awesome Physical Server Backup</text>

    <!-- Subtitle -->
    <text x="0" y="115" fill="#e2e8f0" class="subtitle-text" font-size="19">
      Curated Enterprise Data Center, Bare-Metal Recovery &amp; Ransomware Defense
    </text>

    <!-- Detailed Bullet Tagline -->
    <text x="0" y="145" fill="#94a3b8" class="subtitle-text" font-size="14.5">
      SaaS Platforms • Bare-Metal Recovery (BMR) • Immutable Snapshots • Air-Gapped Vaults
    </text>
  </g>

  <!-- Feature Tags / Bottom Carousel Badges -->
  <g transform="translate(190, 290)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="145" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="18" y="22" fill="#38bdf8" class="badge-text">⚡ Bare-Metal</text>

    <!-- Tag 2 -->
    <rect x="160" y="0" width="165" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="180" y="22" fill="#a78bfa" class="badge-text">🔒 Immutable Vaults</text>

    <!-- Tag 3 -->
    <rect x="340" y="0" width="175" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="358" y="22" fill="#34d399" class="badge-text">🛡️ Anti-Ransomware</text>

    <!-- Tag 4 -->
    <rect x="530" y="0" width="160" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="548" y="22" fill="#fbbf24" class="badge-text">🌐 Cloud &amp; Hybrid</text>
  </g>
</svg>
